name: Windows MSVC

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.arch.name }}, ${{ matrix.build_type }}, ${{ matrix.tls.name }})
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        std: [23]
        arch:
          - name: x64
            cmake_arch: x64
            vcpkg_triplet: x64-windows
            build_dir_suffix: x64
          - name: x86
            cmake_arch: Win32
            vcpkg_triplet: x86-windows
            build_dir_suffix: x86
        tls:
          - { name: No TLS,  backend: none }
          - { name: wolfSSL, backend: wolfssl, vcpkg_port: "wolfssl[asio]" }
          - { name: OpenSSL, backend: openssl, vcpkg_port: openssl }
        exclude:
          - { build_type: Release, tls: { backend: wolfssl } }
          - { build_type: Release, tls: { backend: openssl } }

    steps:
      - uses: actions/checkout@v6

      - name: Setup vcpkg
        if: matrix.tls.vcpkg_port
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 29f10019c26142cc4689b53b8c91da519db09e5c

      - name: Install ${{ matrix.tls.name }} (vcpkg)
        if: matrix.tls.vcpkg_port
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install "${{ matrix.tls.vcpkg_port }}" --triplet "${{ matrix.arch.vcpkg_triplet }}" --overlay-triplets "$env:GITHUB_WORKSPACE/cmake/vcpkg-triplets"

      - name: Configure CMake
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}/build-${{ matrix.tls.backend }}-${{ matrix.arch.build_dir_suffix }}-${{ matrix.build_type }}"
          $vcpkgCmakeArgs = @()
          if ("${{ matrix.tls.vcpkg_port }}") {
            $vcpkgCmakeArgs += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            $vcpkgCmakeArgs += "-DVCPKG_TARGET_TRIPLET=${{ matrix.arch.vcpkg_triplet }}"
          }

          cmake -B $buildDir `
            -A "${{ matrix.arch.cmake_arch }}" `
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -DCMAKE_CXX_FLAGS_DEBUG="/bigobj" `
            -DAERO_TLS_BACKEND=${{ matrix.tls.backend }} `
            $vcpkgCmakeArgs

      - name: Build
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}/build-${{ matrix.tls.backend }}-${{ matrix.arch.build_dir_suffix }}-${{ matrix.build_type }}"
          cmake --build $buildDir --config ${{ matrix.build_type }} --parallel

      - name: Test
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $buildDir = "${{ github.workspace }}/build-${{ matrix.tls.backend }}-${{ matrix.arch.build_dir_suffix }}-${{ matrix.build_type }}"
          ctest --test-dir $buildDir --output-on-failure --timeout 30 -C ${{ matrix.build_type }}
