name: Windows ClangCL

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.tls.name }})
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]
        std: [23]
        tls:
          - { name: No TLS,  backend: none }
          - { name: wolfSSL, backend: wolfssl, vcpkg_port: "wolfssl[asio]" }
          - { name: OpenSSL, backend: openssl, vcpkg_port: openssl }

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - uses: actions/checkout@v6

      - name: Setup vcpkg
        if: matrix.tls.vcpkg_port
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 29f10019c26142cc4689b53b8c91da519db09e5c

      - name: Install ${{ matrix.tls.name }} (vcpkg)
        if: matrix.tls.vcpkg_port
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install "${{ matrix.tls.vcpkg_port }}" --triplet "$env:VCPKG_DEFAULT_TRIPLET" --overlay-triplets "$env:GITHUB_WORKSPACE/cmake/vcpkg-triplets"

      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkgCmakeArgs = @()
          if ("${{ matrix.tls.vcpkg_port }}") {
            $vcpkgCmakeArgs += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            $vcpkgCmakeArgs += "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"
          }

          cmake -B "${{ github.workspace }}/build-${{ matrix.tls.backend }}" `
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -A x64 `
            -T ClangCL `
            -DAERO_TLS_BACKEND=${{ matrix.tls.backend }} `
            $vcpkgCmakeArgs

      - name: Build
        run: cmake --build "${{ github.workspace }}/build-${{ matrix.tls.backend }}" --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build-${{ matrix.tls.backend }}
        run: ctest --output-on-failure --timeout 30 -C ${{ matrix.build_type }}
